name: SAVIA — Generar FASE 1

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'generate_savia_fase1.py'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generar estructura SAVIA FASE 1
        run: |
          python3 generate_savia_fase1.py .
          echo "Estructura generada:"
          find . -type f | grep -E "\.(kt|xml|gradle)$" | sort

      - name: Commit y push automático
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🌿 SAVIA FASE 1 auto-generada: Room + Entities + Seed + UI base"
          file_pattern: "*"
