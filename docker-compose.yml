version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: savia-api
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-savia_jwt_secret_2026}
      - PORT=3000
    restart: unless-stopped

  # Optional: nginx reverse proxy for production
